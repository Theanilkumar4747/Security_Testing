name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *"        # nightly
  workflow_dispatch:
    inputs:
      dast_target:
        description: "Staging URL for DAST/API scans (host must be in scan.allowed.hosts)"
        required: false

permissions:
  contents: read
  security-events: write       # upload SARIF to code scanning

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  static-security:
    name: SAST / SCA / Secrets / IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # gitleaks scans history

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install scanners
        run: |
          pip install --quiet semgrep checkov
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Build and unit-test the framework
        run: mvn -B -ntp verify

      - name: Run security scans (fails the build if the quality gate fails)
        run: |
          java -jar target/security-framework.jar \
            --categories=SAST,SCA,SECRETS,CLOUD \
            --name="${{ github.event.repository.name }}" \
            --source=. \
            --out=target/security-reports
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('target/security-reports/security-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/security-reports/security-report.sarif

      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: target/security-reports/

  dynamic-security:
    name: DAST / API (staging only)
    if: github.event_name == 'schedule' || github.event.inputs.dast_target != ''
    runs-on: ubuntu-latest
    needs: static-security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -ntp -DskipTests package
      - name: Run DAST + API scans
        env:
          SCAN_URL: ${{ github.event.inputs.dast_target || vars.STAGING_URL }}
          SCAN_ALLOWED_HOSTS: ${{ vars.STAGING_HOST }}      # explicit allow-list, e.g. pp-dev.veportal.in
          API_TOKEN_A: ${{ secrets.API_TOKEN_A }}
          API_TOKEN_B: ${{ secrets.API_TOKEN_B }}
        run: |
          java -jar target/security-framework.jar \
            --scanners=zap,owasp-api-top10,restassured-security-tests \
            --name="${{ github.event.repository.name }}-dast" \
            --out=target/security-reports-dast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-dast
          path: target/security-reports-dast/
