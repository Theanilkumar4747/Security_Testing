# ---------------------------------------------------------------------------
# Framework settings. Precedence: -Dkey=value > ENV (key upper-cased, '.'->'_') > this file.
# NEVER put secrets here. Provide them via environment variables, e.g.
#   SONAR_TOKEN, SNYK_TOKEN, CX_CLIENT_ID, CX_CLIENT_SECRET, JIRA_TOKEN,
#   SLACK_WEBHOOK_URL, DEFECTDOJO_TOKEN, SMTP_PASSWORD, API_TOKEN_A, API_TOKEN_B
# ---------------------------------------------------------------------------

# Target (also: SCAN_URL, SCAN_SOURCE, SCAN_IMAGE, SCAN_OPENAPI, SCAN_IAC)
scan.name=application
scan.url=https://pp-dev.veportal.in/client/dashboard
scan.source=.
scan.output=target/security-reports
scan.parallelism=4

# SAFETY: dynamic scanners (DAST/API) refuse any host not listed here.
scan.allowed.hosts=localhost,127.0.0.1,pp-dev.veportal.in

report.formats=html,json,sarif

# Dashboard: none | filesystem | http
dashboard.type=none
dashboard.dir=target/dashboard

# Integrations (all off by default)
notify.onlyOnFailure=true
integration.slack.enabled=false
integration.email.enabled=false
integration.jira.enabled=false
integration.jira.minSeverity=HIGH
integration.jira.maxIssues=25
integration.defectdojo.enabled=false

sonar.host.url=http://localhost:9000
smtp.port=587
